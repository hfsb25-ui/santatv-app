name: Gerar APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Compilar
        run: |
          set -o pipefail
          gradle --no-daemon assembleRelease 2>&1 | tee build.log
      - name: Publicar log
        if: always()
        run: |
          mkdir logout && cp build.log logout/ 2>/dev/null || echo "sem log" > logout/build.log
          cd logout && git init -q -b log && git config user.name "github-actions" && git config user.email "github-actions@users.noreply.github.com"
          git add build.log && git commit -q -m "log ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" log
      - run: cp app/build/outputs/apk/release/app-release.apk SantaBarbaraTV.apk
      - uses: actions/upload-artifact@v4
        with: { name: SantaBarbaraTV, path: SantaBarbaraTV.apk }
      # Também publica o APK no ramo "apk" do repositório
      - name: Publicar no ramo apk
        run: |
          mkdir out && cp SantaBarbaraTV.apk out/ && cd out
          git init -q -b apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add SantaBarbaraTV.apk
          git commit -q -m "APK de ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" apk
